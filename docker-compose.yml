services:

  # =========================
  # Go API
  # =========================
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile

    container_name: meshmind-api

    env_file:
      - .env

    ports:
      - "8080:8080"

    depends_on:
      - qdrant

    restart: unless-stopped


  # =========================
  # Python AI Worker
  # =========================
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile

    container_name: meshmind-worker

    env_file:
      - .env

    depends_on:
      - qdrant

    restart: unless-stopped


  # =========================
  # Qdrant
  # =========================
  qdrant:
    image: qdrant/qdrant:latest

    container_name: qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    restart: unless-stopped


volumes:
  qdrant_data: